name: Release

# A tag v* releases: image, SBOM, provenance, manifests for staging and prod, and a PR in gitops
# that moves staging. Runs in the GitHub Environment "staging" (tags v* only).

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    # Not in the template itself: it is not an app (kind=platform), octo-sts refuses it.
    if: ${{ !github.event.repository.is_template }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: homelab-selfuryon/github-workflows/.github/workflows/app-release.yaml@v1.0.1
