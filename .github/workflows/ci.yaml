name: CI

# Thin caller: the logic is in homelab-selfuryon/github-workflows. Renovate pins the
# reusable workflows to a commit SHA once the first release exists.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-ci:
    permissions:
      contents: read
      packages: read
    uses: homelab-selfuryon/github-workflows/.github/workflows/rust-ci.yaml@c49b40a6acc765b064daff0e0e8e9c3bc6486a37 # v1.0.1

  lint-workflows:
    permissions:
      contents: read
    uses: homelab-selfuryon/github-workflows/.github/workflows/lint-workflows.yaml@c49b40a6acc765b064daff0e0e8e9c3bc6486a37 # v1.0.1

  # The single required status check (branch ruleset in platform-terraform/github).
  final-check:
    if: always()
    needs: [rust-ci, lint-workflows]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to have succeeded or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a required job ended with: $r"; exit 1 ;; esac
          done
