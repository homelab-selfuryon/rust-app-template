[package]
name = "rust-app-template"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "A Rust app on the homelab-selfuryon paved road"

[dependencies]
anyhow = "1"
axum = "0.8"
jsonwebtoken = { version = "11", default-features = false, features = [
  "aws_lc_rs",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "net",
  "time",
  "fs",
  "sync",
] }
tower-http = { version = "0.7", features = ["trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
aws-lc-rs = "1"
base64 = "0.22"
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
